<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>101925d-004 – Quest3 Telepresence VR Board (Voice Meter)</title>
<style>
body{
  margin:0;
  overflow:hidden;
  background:#000;
  color:#0f0;
  font-family:monospace;
}
#versionTag{
  position:fixed;
  top:6px;
  left:10px;
  font-size:14px;
}
.topbar{
  position:fixed;
  top:6px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:10px;
}
button{
  background:#111;
  border:1px solid #0f0;
  color:#0f0;
  border-radius:6px;
  padding:6px 14px;
  cursor:pointer;
  font-family:monospace;
  font-size:14px;
}
button.active{background:#0f0;color:#000;}
#liveFeed{
  position:absolute;
  top:60px;
  left:50%;
  transform:translateX(-50%);
  width:480px;
  height:270px;
  background:#111;
  border:2px solid #0f0;
  border-radius:10px;
}
#meterCanvas{
  position:absolute;
  top:345px;
  left:50%;
  transform:translateX(-50%);
  width:480px;
  height:30px;
  border:1px solid #0f0;
  border-radius:4px;
}
.controls{
  position:absolute;
  top:420px;
  left:50%;
  transform:translateX(-50%);
  display:grid;
  grid-template-columns:100px 100px 100px;
  grid-template-rows:100px 100px 100px;
  gap:15px;
}
.arrow{
  border:2px solid #0f0;
  color:#0f0;
  background:#000;
  border-radius:10px;
  font-size:32px;
  display:flex;
  justify-content:center;
  align-items:center;
  cursor:pointer;
  transition:background .2s,color .2s;
}
.arrow.active{background:#0f0;color:#000;}
.arrow.stop{background:#0f0;color:#000;}
#forward{grid-column:2;grid-row:1;}
#left{grid-column:1;grid-row:2;}
#stop{grid-column:2;grid-row:2;}
#right{grid-column:3;grid-row:2;}
#backward{grid-column:2;grid-row:3;}
</style>
</head>
<body>
<div id="versionTag">Version: 101925d-004</div>

<div class="topbar">
  <button id="thumbBtn">Turn Thumbball On</button>
  <button id="vrBtn">Checking VR...</button>
  <button id="voiceBtn">Voice Commands: OFF</button>
</div>

<video id="liveFeed" autoplay muted playsinline></video>
<canvas id="meterCanvas"></canvas>

<div class="controls">
  <div class="arrow" id="forward">▲</div>
  <div class="arrow" id="left">◄</div>
  <div class="arrow stop" id="stop">■</div>
  <div class="arrow" id="right">►</div>
  <div class="arrow" id="backward">▼</div>
</div>

<script>
// ===== initial setup =====
const vrBtn=document.getElementById("vrBtn");
if(navigator.xr){vrBtn.textContent="Enter VR";}else{vrBtn.textContent="VR Not Supported";vrBtn.disabled=true;}

// ===== arrows =====
const arrows={
  forward:document.getElementById("forward"),
  backward:document.getElementById("backward"),
  left:document.getElementById("left"),
  right:document.getElementById("right"),
  stop:document.getElementById("stop")
};
function activateArrow(dir){
  Object.values(arrows).forEach(a=>a.classList.remove("active","stop"));
  arrows[dir].classList.add("active");
}
function stopAll(){
  Object.values(arrows).forEach(a=>a.classList.remove("active"));
  arrows.stop.classList.add("stop");
}
stopAll();
function drive(dir){
  activateArrow(dir);
  console.log("Driving "+dir);
  setTimeout(()=>{stopAll();console.log("Stopped");},1000);
}
for(const [dir,el] of Object.entries(arrows)){
  el.addEventListener("click",()=>{dir==="stop"?stopAll():drive(dir);});
}

// ===== livestream placeholder =====
const live=document.getElementById("liveFeed");
live.src="https://cdn.coverr.co/videos/coverr-lofi-study-7134/1080p.mp4";
live.loop=true;live.play();

// ===== voice & audio meter =====
const voiceBtn=document.getElementById("voiceBtn");
let listening=false;
let recognition;
let audioCtx, analyser, dataArray;
const meterCanvas=document.getElementById("meterCanvas");
const ctx=meterCanvas.getContext("2d");

function startAudioMeter(){
  if(audioCtx) return;
  navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{
    audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    const source=audioCtx.createMediaStreamSource(stream);
    analyser=audioCtx.createAnalyser();
    analyser.fftSize=256;
    const bufferLength=analyser.frequencyBinCount;
    dataArray=new Uint8Array(bufferLength);
    source.connect(analyser);
    drawMeter();
  }).catch(e=>console.error(e));
}
function drawMeter(){
  requestAnimationFrame(drawMeter);
  if(!analyser) return;
  analyser.getByteFrequencyData(dataArray);
  let avg=dataArray.reduce((a,b)=>a+b)/dataArray.length;
  let bars=40;
  let width=meterCanvas.width/bars;
  ctx.clearRect(0,0,meterCanvas.width,meterCanvas.height);
  for(let i=0;i<bars;i++){
    let height=(avg/255)*(meterCanvas.height);
    ctx.fillStyle=`rgb(0,${150+Math.random()*105},0)`;
    ctx.fillRect(i*width,meterCanvas.height-height,width-1,height);
  }
}

function flashMeter(){
  ctx.fillStyle="rgba(0,255,0,0.6)";
  ctx.fillRect(0,0,meterCanvas.width,meterCanvas.height);
  setTimeout(()=>ctx.clearRect(0,0,meterCanvas.width,meterCanvas.height),100);
}

if("webkitSpeechRecognition" in window){
  recognition=new webkitSpeechRecognition();
  recognition.continuous=true;
  recognition.interimResults=false;
  recognition.lang="en-US";
  recognition.onresult=function(e){
    const txt=e.results[e.results.length-1][0].transcript.toLowerCase().trim();
    console.log("Heard:",txt);
    flashMeter();
    if(txt.match(/\b(forward|forwards|go\sforward|drive\sforward|move\sforward)\b/)) drive("forward");
    else if(txt.match(/\b(back|backward|go\sback|drive\sback|reverse)\b/)) drive("backward");
    else if(txt.match(/\b(left|turn\sleft|go\sleft|move\sleft)\b/)) drive("left");
    else if(txt.match(/\b(right|turn\sright|go\sright|move\sright)\b/)) drive("right");
  };
  recognition.onend=()=>{if(listening) recognition.start();}
}else{
  voiceBtn.disabled=true;
  voiceBtn.textContent="Voice Not Supported";
}

voiceBtn.addEventListener("click",()=>{
  if(!recognition) return;
  listening=!listening;
  if(listening){
    voiceBtn.classList.add("active");
    voiceBtn.textContent="Voice Commands: ON";
    startAudioMeter();
    recognition.start();
  }else{
    voiceBtn.classList.remove("active");
    voiceBtn.textContent="Voice Commands: OFF";
    if(recognition) recognition.stop();
  }
});
</script>
</body>
</html>
