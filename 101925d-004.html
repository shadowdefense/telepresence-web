<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>101925d-004 – Quest3 Telepresence VR Board (Full Update with Push-to-Talk + Voice Meter + 5-Minute Safety)</title>
<style>
body{margin:0;overflow:hidden;background:#000;color:#0f0;font-family:monospace;}
#versionTag{position:fixed;top:6px;left:10px;font-size:14px;}
.topbar{position:fixed;top:6px;left:50%;transform:translateX(-50%);display:flex;gap:10px;}
button{background:#111;border:1px solid #0f0;color:#0f0;border-radius:6px;padding:6px 14px;cursor:pointer;font-family:monospace;font-size:14px;}
button.active{background:#0f0;color:#000;}
#liveFeed{position:absolute;top:60px;left:50%;transform:translateX(-50%);width:480px;height:270px;background:#111;border:2px solid #0f0;border-radius:10px;}
#meterCanvas{position:absolute;top:345px;left:50%;transform:translateX(-50%);width:480px;height:30px;border:1px solid #0f0;border-radius:4px;}
.controls{position:absolute;top:420px;left:50%;transform:translateX(-50%);display:grid;grid-template-columns:100px 100px 100px;grid-template-rows:100px 100px 100px;gap:15px;}
.arrow{border:2px solid #0f0;color:#0f0;background:#000;border-radius:10px;font-size:32px;display:flex;justify-content:center;align-items:center;cursor:pointer;transition:background .2s,color .2s;}
.arrow.active{background:#0f0;color:#000;}
.arrow.stop{background:#0f0;color:#000;}
#forward{grid-column:2;grid-row:1;}
#left{grid-column:1;grid-row:2;}
#stop{grid-column:2;grid-row:2;}
#right{grid-column:3;grid-row:2;}
#backward{grid-column:2;grid-row:3;}
#reminder{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#000;border:2px solid #0f0;padding:20px;border-radius:8px;color:#0f0;z-index:200;}
</style>
</head>
<body>
<div id="versionTag">Version: 101925d-004</div>

<div class="topbar">
  <button id="thumbBtn">Turn Thumbball On</button>
  <button id="vrBtn">Checking VR...</button>
  <button id="voiceBtn">Voice Commands: OFF</button>
  <button id="talkBtn">Push-to-Talk</button>
</div>

<video id="liveFeed" autoplay muted playsinline></video>
<canvas id="meterCanvas"></canvas>
<div id="reminder"></div>

<div class="controls">
  <div class="arrow" id="forward">▲</div>
  <div class="arrow" id="left">◄</div>
  <div class="arrow stop" id="stop">■</div>
  <div class="arrow" id="right">►</div>
  <div class="arrow" id="backward">▼</div>
</div>

<script>
const vrBtn=document.getElementById("vrBtn");
if(navigator.xr){vrBtn.textContent="Enter VR";}else{vrBtn.textContent="VR Not Supported";vrBtn.disabled=true;}

const arrows={forward:forward,backward:backward,left:left,right:right,stop:stop};
for(let k in arrows){arrows[k]=document.getElementById(k);}
function activateArrow(d){Object.values(arrows).forEach(a=>a.classList.remove("active","stop"));arrows[d].classList.add("active");}
function stopAll(){Object.values(arrows).forEach(a=>a.classList.remove("active"));arrows.stop.classList.add("stop");}
stopAll();
function drive(d){activateArrow(d);setTimeout(stopAll,1000);}
Object.entries(arrows).forEach(([d,e])=>e.addEventListener("click",()=>{d==="stop"?stopAll():drive(d);}))

// video placeholder
const live=document.getElementById("liveFeed");
live.src="https://cdn.coverr.co/videos/coverr-lofi-study-7134/1080p.mp4";live.loop=true;live.play();

// audio meter
const meterCanvas=document.getElementById("meterCanvas");const ctx=meterCanvas.getContext("2d");
let audioCtx,analyser,dataArray;
function startMeter(stream){if(audioCtx)return;audioCtx=new(window.AudioContext||window.webkitAudioContext)();const src=audioCtx.createMediaStreamSource(stream);analyser=audioCtx.createAnalyser();analyser.fftSize=256;dataArray=new Uint8Array(analyser.frequencyBinCount);src.connect(analyser);draw();}
function draw(){requestAnimationFrame(draw);if(!analyser)return;analyser.getByteFrequencyData(dataArray);let avg=dataArray.reduce((a,b)=>a+b)/dataArray.length*1.5;let bars=40,w=meterCanvas.width/bars;ctx.clearRect(0,0,meterCanvas.width,meterCanvas.height);for(let i=0;i<bars;i++){let h=(avg/255)*meterCanvas.height;ctx.fillStyle=`rgb(0,${180+Math.random()*75},0)`;ctx.fillRect(i*w,meterCanvas.height-h,w-1,h);}}

// voice recognition
const voiceBtn=document.getElementById("voiceBtn");let listening=false,recognition,timerVoice;
if("webkitSpeechRecognition"in window){recognition=new webkitSpeechRecognition();recognition.continuous=true;recognition.interimResults=false;recognition.lang="en-US";
recognition.onresult=e=>{const t=e.results[e.results.length-1][0].transcript.toLowerCase();if(t.match(/forward|forwards|go\sforward|drive\sforward|move\sforward/))drive("forward");
else if(t.match(/back|backward|go\sback|drive\sback|reverse/))drive("backward");
else if(t.match(/left|turn\sleft|go\sleft|move\sleft/))drive("left");
else if(t.match(/right|turn\sright|go\sright|move\sright/))drive("right");};
recognition.onend=()=>{if(listening)recognition.start();};
}else{voiceBtn.disabled=true;voiceBtn.textContent="Voice Not Supported";}

function beep(){const a=new AudioContext(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.type="square";o.frequency.value=800;g.gain.setValueAtTime(.1,a.currentTime);o.start();o.stop(a.currentTime+.2);}

function remind(t){beep();const r=document.getElementById("reminder");r.innerHTML=`⚠️ ${t}`;r.style.display="block";setTimeout(()=>r.style.display="none",6000);}

voiceBtn.addEventListener("click",async()=>{
 if(!recognition)return;
 listening=!listening;
 if(listening){
   voiceBtn.classList.add("active");voiceBtn.textContent="Voice Commands: ON";
   const s=await navigator.mediaDevices.getUserMedia({audio:true});
   startMeter(s);recognition.start();
   clearTimeout(timerVoice);timerVoice=setTimeout(()=>remind("Don't forget to turn off Voice Command Mode!"),300000);
 }else{
   voiceBtn.classList.remove("active");voiceBtn.textContent="Voice Commands: OFF";
   recognition.stop();clearTimeout(timerVoice);
 }});

// push-to-talk
const talkBtn=document.getElementById("talkBtn");let talking=false,pttStream,timerTalk;
talkBtn.addEventListener("mousedown",startTalk);
talkBtn.addEventListener("touchstart",startTalk);
talkBtn.addEventListener("mouseup",stopTalk);
talkBtn.addEventListener("mouseleave",stopTalk);
talkBtn.addEventListener("touchend",stopTalk);

async function startTalk(){
 if(talking)return;talking=true;talkBtn.classList.add("active");talkBtn.textContent="Talking...";
 if(listening)recognition.stop(); // pause recognition while talking
 pttStream=await navigator.mediaDevices.getUserMedia({audio:true});
 startMeter(pttStream);
 // placeholder: send audio to robot loudspeaker endpoint
 console.log("Push-to-Talk active – streaming audio to bot...");
 clearTimeout(timerTalk);timerTalk=setTimeout(()=>remind("Microphone has been on 5 minutes!"),300000);
}
function stopTalk(){
 if(!talking)return;talking=false;talkBtn.classList.remove("active");talkBtn.textContent="Push-to-Talk";
 if(pttStream){pttStream.getTracks().forEach(t=>t.stop());pttStream=null;}
 if(listening)recognition.start();
 clearTimeout(timerTalk);
 console.log("Push-to-Talk ended.");
}
</script>
</body>
</html>
