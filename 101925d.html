<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>101925d-001 – Quest3 Telepresence VR Board</title>
<style>
  body { margin:0; overflow:hidden; background:#000; color:#0f0; font-family:monospace; }
  #versionTag {
    position:fixed; top:6px; left:10px; color:#0f0;
    font-size:13px; font-weight:bold; text-shadow:0 0 8px #0f0; z-index:99;
  }
  canvas { display:block; }
</style>
</head>
<body>
<div id="versionTag">Ver 101925d-001</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/webxr/VRButton.js"></script>

<script>
/* ========= BASIC SCENE SETUP ========= */
let scene, camera, renderer;
scene = new THREE.Scene();
camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.1, 50);
renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x000000);
renderer.xr.enabled = true;
document.body.appendChild(renderer.domElement);
document.body.appendChild(THREE.VRButton.createButton(renderer));

/* ========= LIGHTS ========= */
const ambient = new THREE.AmbientLight(0x00ff00, 0.5);
scene.add(ambient);
const point = new THREE.PointLight(0x00ff00, 1, 5);
point.position.set(0, 2, 1);
scene.add(point);

/* ========= MAIN PANEL (video area) ========= */
const panelWidth = 1.6, panelHeight = 0.9;
const panelGeo = new THREE.PlaneGeometry(panelWidth, panelHeight);
const panelMat = new THREE.MeshBasicMaterial({ color:0x111111 });
const panel = new THREE.Mesh(panelGeo, panelMat);
panel.position.set(0, 1.3, -2);
scene.add(panel);

/* ========= VIDEO FRAME (lofi livestream) ========= */
const iframeTexture = new THREE.TextureLoader().load('https://dummyimage.com/800x450/000/0f0&text=Lofi+Stream');
const videoMat = new THREE.MeshBasicMaterial({ map: iframeTexture });
const videoGeo = new THREE.PlaneGeometry(1.2, 0.68);
const videoPlane = new THREE.Mesh(videoGeo, videoMat);
videoPlane.position.set(0, 1.3, -1.99);
scene.add(videoPlane);

/* ========= BUTTON CREATION ========= */
function makeButton(label, x, y, z) {
  const geo = new THREE.BoxGeometry(0.25, 0.1, 0.02);
  const mat = new THREE.MeshBasicMaterial({ color:0x003300 });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(x, y, z);
  mesh.userData.label = label;
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = 256; canvas.height = 64;
  ctx.fillStyle = 'black'; ctx.fillRect(0,0,256,64);
  ctx.fillStyle = '#0f0'; ctx.font = '32px monospace';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(label, 128, 32);
  const tex = new THREE.CanvasTexture(canvas);
  const textMat = new THREE.MeshBasicMaterial({ map: tex, transparent:true });
  const textPlane = new THREE.Mesh(new THREE.PlaneGeometry(0.25,0.1), textMat);
  textPlane.position.set(0,0,0.011);
  mesh.add(textPlane);
  scene.add(mesh);
  return mesh;
}

/* Arrow controls layout */
const buttons = {
  up: makeButton("↑", 0, 0.6, -2),
  down: makeButton("↓", 0, 0.4, -2),
  left: makeButton("←", -0.3, 0.5, -2),
  right: makeButton("→", 0.3, 0.5, -2),
  stop: makeButton("■", 0, 0.5, -2.01)
};
const topButtons = {
  lights: makeButton("Lights", -0.7, 0.9, -2),
  mic: makeButton("Mic", -0.3, 0.9, -2),
  test: makeButton("Test", 0.1, 0.9, -2),
  thumb: makeButton("Thumb", 0.5, 0.9, -2)
};

/* ========= HIGHLIGHT LOGIC ========= */
function setActive(btn) {
  for (let b in buttons) buttons[b].material.color.set(0x003300);
  if (btn && buttons[btn]) buttons[btn].material.color.set(0x00ff00);
}

/* ========= GAMEPAD POLLING ========= */
let lastCmd = 'stop';
function pollGamepad(){
  const pads = navigator.getGamepads();
  let cmd='stop';
  for(const gp of pads){if(!gp)continue;
    const x=gp.axes[0]||0, y=gp.axes[1]||0;
    if(y<-0.4)cmd='forward';
    else if(y>0.4)cmd='backward';
    else if(x<-0.4)cmd='left';
    else if(x>0.4)cmd='right';
    break;
  }
  if(cmd!==lastCmd){
    lastCmd=cmd;
    if(cmd==='forward')setActive('up');
    else if(cmd==='backward')setActive('down');
    else if(cmd==='left')setActive('left');
    else if(cmd==='right')setActive('right');
    else setActive('stop');
  }
  requestAnimationFrame(pollGamepad);
}
pollGamepad();

/* ========= BASIC RENDER LOOP ========= */
function animate(){renderer.setAnimationLoop(()=>{renderer.render(scene,camera);});}
animate();

/* ========= WINDOW RESIZE ========= */
window.addEventListener('resize',()=>{
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
});
</script>
</body>
</html>
