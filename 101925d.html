<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>101925d-002 – Quest3 Telepresence VR Board (Fixed VRButton)</title>
<style>
 body{margin:0;overflow:hidden;background:#000;color:#0f0;font-family:monospace;}
 #versionTag{
   position:fixed;top:6px;left:10px;color:#0f0;
   font-size:13px;font-weight:bold;text-shadow:0 0 8px #0f0;z-index:99;
 }
 canvas{display:block;}
</style>
</head>
<body>
<div id="versionTag">Ver 101925d-002</div>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";
import { VRButton } from "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/webxr/VRButton.js";

/* ===== SCENE SETUP ===== */
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.1, 50);
camera.position.set(0,1.5,0);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.xr.enabled = true;
document.body.appendChild(renderer.domElement);
document.body.appendChild(VRButton.createButton(renderer));

/* ===== LIGHTS ===== */
scene.add(new THREE.AmbientLight(0x00ff00,0.4));
const point = new THREE.PointLight(0x00ff00,1,5);
point.position.set(0,2,2);
scene.add(point);

/* ===== PANEL BACKGROUND ===== */
const boardGeo = new THREE.PlaneGeometry(2.0,1.2);
const boardMat = new THREE.MeshBasicMaterial({color:0x111111});
const board = new THREE.Mesh(boardGeo, boardMat);
board.position.set(0,1.5,-2);
scene.add(board);

/* ===== BUTTON CREATOR ===== */
function makeButton(txt,x,y,z){
 const geo = new THREE.BoxGeometry(0.25,0.1,0.02);
 const mat = new THREE.MeshBasicMaterial({color:0x003300});
 const mesh = new THREE.Mesh(geo,mat);
 mesh.position.set(x,y,z);
 const c = document.createElement("canvas");
 const ctx = c.getContext("2d");
 c.width=256;c.height=64;
 ctx.fillStyle="black";ctx.fillRect(0,0,256,64);
 ctx.fillStyle="#0f0";ctx.font="32px monospace";
 ctx.textAlign="center";ctx.textBaseline="middle";
 ctx.fillText(txt,128,32);
 const tex = new THREE.CanvasTexture(c);
 const tmat = new THREE.MeshBasicMaterial({map:tex,transparent:true});
 const tplane = new THREE.Mesh(new THREE.PlaneGeometry(0.25,0.1),tmat);
 tplane.position.z=0.012;
 mesh.add(tplane);
 scene.add(mesh);
 return mesh;
}

/* ===== BUTTONS ===== */
const buttons={
 up:makeButton("↑",0,1.7,-2.01),
 down:makeButton("↓",0,1.3,-2.01),
 left:makeButton("←",-0.3,1.5,-2.01),
 right:makeButton("→",0.3,1.5,-2.01),
 stop:makeButton("■",0,1.5,-2.02)
};

/* ===== GLOW LOGIC ===== */
function setActive(id){
 for(const k in buttons)buttons[k].material.color.set(0x003300);
 if(id&&buttons[id])buttons[id].material.color.set(0x00ff00);
}

/* ===== GAMEPAD LOOP ===== */
let last="stop";
function poll(){
 const pads=navigator.getGamepads();
 let cmd="stop";
 for(const gp of pads){if(!gp)continue;
   const x=gp.axes[0]||0,y=gp.axes[1]||0;
   if(y<-0.4)cmd="forward";
   else if(y>0.4)cmd="backward";
   else if(x<-0.4)cmd="left";
   else if(x>0.4)cmd="right";
   break;
 }
 if(cmd!==last){
   last=cmd;
   if(cmd==="forward")setActive("up");
   else if(cmd==="backward")setActive("down");
   else if(cmd==="left")setActive("left");
   else if(cmd==="right")setActive("right");
   else setActive("stop");
 }
 requestAnimationFrame(poll);
}
poll();

/* ===== ANIMATION LOOP ===== */
renderer.setAnimationLoop(()=>renderer.render(scene,camera));

/* ===== RESIZE ===== */
addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
